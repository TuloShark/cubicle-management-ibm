# ================================================================================
# Backup and Disaster Recovery Configuration
# IBM Cubicle Management System - Data Protection
# ================================================================================

# MongoDB Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  timeZone: "America/Costa_Rica"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cubicle-management
            component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-service-account
          containers:
          - name: mongodb-backup
            image: mongo:5.0
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Create backup directory
              BACKUP_DIR="/backups/$(date +%Y%m%d_%H%M%S)"
              mkdir -p $BACKUP_DIR
              
              # Create backup
              echo "Starting MongoDB backup..."
              mongodump \
                --host=${MONGO_HOST}:${MONGO_PORT} \
                --username=${MONGO_USERNAME} \
                --password=${MONGO_PASSWORD} \
                --authenticationDatabase=admin \
                --db=${MONGO_DATABASE} \
                --out=$BACKUP_DIR
              
              # Compress backup
              cd /backups
              tar -czf "${BACKUP_DIR}.tar.gz" "$(basename $BACKUP_DIR)"
              rm -rf "$BACKUP_DIR"
              
              # Remove backups older than 30 days
              find /backups -name "*.tar.gz" -mtime +30 -delete
              
              echo "Backup completed successfully: ${BACKUP_DIR}.tar.gz"
              
              # Optional: Upload to cloud storage
              if [ -n "$AWS_S3_BUCKET" ]; then
                aws s3 cp "${BACKUP_DIR}.tar.gz" "s3://${AWS_S3_BUCKET}/mongodb-backups/"
                echo "Backup uploaded to S3"
              fi
            
            env:
            - name: MONGO_HOST
              value: "mongodb-service"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "admin"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: root-password
            - name: MONGO_DATABASE
              value: "cubicle_management_prod"
            - name: AWS_S3_BUCKET
              value: "your-backup-bucket"  # Optional
            
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: mongodb-backup-storage

---
# Backup Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service-account
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: backup
  annotations:
    # If using AWS IRSA (IAM Roles for Service Accounts)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/cubicle-backup-role

---
# Velero Backup Schedule (if using Velero)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: cubicle-management-backup
  namespace: velero
  labels:
    app: cubicle-management
    component: disaster-recovery
spec:
  schedule: "0 1 * * *"  # Daily at 1 AM
  template:
    ttl: 720h  # 30 days retention
    includedNamespaces:
    - cubicle-management
    excludedResources:
    - events
    - events.events.k8s.io
    snapshotVolumes: true
    storageLocation: default
    volumeSnapshotLocations:
    - default

---
# Application State Backup Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-state-backup
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: backup
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cubicle-management
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: app-state-backup
            image: alpine:3.18
            command:
            - /bin/sh
            - -c
            - |
              set -e
              
              # Create backup directory
              BACKUP_DIR="/app-backups/$(date +%Y%m%d_%H%M%S)"
              mkdir -p $BACKUP_DIR
              
              # Backup application logs
              echo "Backing up application logs..."
              cp -r /app/logs/* $BACKUP_DIR/ || true
              
              # Backup configuration (excluding secrets)
              echo "Backing up configuration..."
              kubectl get configmaps -n cubicle-management -o yaml > $BACKUP_DIR/configmaps.yaml
              
              # Create archive
              cd /app-backups
              tar -czf "${BACKUP_DIR}.tar.gz" "$(basename $BACKUP_DIR)"
              rm -rf "$BACKUP_DIR"
              
              # Cleanup old backups
              find /app-backups -name "*.tar.gz" -mtime +60 -delete
              
              echo "Application state backup completed"
            
            volumeMounts:
            - name: app-logs-storage
              mountPath: /app/logs
            - name: backup-storage
              mountPath: /app-backups
            
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          
          volumes:
          - name: app-logs-storage
            persistentVolumeClaim:
              claimName: app-logs-storage
          - name: backup-storage
            persistentVolumeClaim:
              claimName: mongodb-backup-storage

---
# Disaster Recovery Documentation ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: disaster-recovery-procedures
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: documentation
data:
  recovery-procedures.md: |
    # Disaster Recovery Procedures
    ## IBM Cubicle Management System
    
    ### 1. Database Recovery
    
    #### From MongoDB Backup:
    ```bash
    # Extract backup
    tar -xzf backup_20231215_020000.tar.gz
    
    # Restore database
    mongorestore \
      --host=mongodb-service:27017 \
      --username=admin \
      --password=<password> \
      --authenticationDatabase=admin \
      --db=cubicle_management_prod \
      backup_20231215_020000/cubicle_management_prod/
    ```
    
    #### From Velero Backup:
    ```bash
    # List available backups
    velero backup get
    
    # Restore from backup
    velero restore create --from-backup <backup-name>
    ```
    
    ### 2. Application Recovery
    
    #### Scaling Issues:
    ```bash
    # Check pod status
    kubectl get pods -n cubicle-management
    
    # Restart deployments
    kubectl rollout restart deployment/cubicle-api -n cubicle-management
    kubectl rollout restart deployment/cubicle-frontend -n cubicle-management
    ```
    
    #### Database Connection Issues:
    ```bash
    # Check MongoDB status
    kubectl logs -f statefulset/mongodb -n cubicle-management
    
    # Check secrets
    kubectl get secrets -n cubicle-management
    ```
    
    ### 3. Emergency Contacts
    - DevOps Team: devops@company.com
    - Database Team: dba@company.com
    - Security Team: security@company.com
    
    ### 4. Recovery Time Objectives (RTO)
    - Critical systems: 1 hour
    - Non-critical features: 4 hours
    - Full functionality: 8 hours
    
    ### 5. Recovery Point Objectives (RPO)
    - Database: 24 hours (daily backups)
    - Application state: 1 week (weekly backups)
    - Real-time data: 1 hour (application recovery)
