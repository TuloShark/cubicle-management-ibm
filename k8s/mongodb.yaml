# ================================================================================
# MongoDB StatefulSet Deployment  
# IBM Cubicle Management System - Database Layer (Simple & Working)
# ================================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: database
spec:
# This StatefulSet manages the MongoDB database for the Cubicle Management System
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app: cubicle-management
      component: database
  template:
    metadata:
      labels:
        app: cubicle-management
        component: database
    spec:
    # MongoDB container configuration
      containers:
      - name: mongodb
        image: mongo:5.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
            # Reference to the secret containing MongoDB root password
              name: mongodb-secrets
              key: mongodb-root-password
        - name: MONGO_INITDB_DATABASE
          value: "space_optimization"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 2Gi
        livenessProbe:
          exec:
          # MongoDB liveness check
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
          # MongoDB readiness check
            command:
            - mongosh
            - --eval
            - "db.runCommand('ping').ok"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: mongodb-storage
      labels:
        app: cubicle-management
        component: database
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: database
spec:
  selector:
    app: cubicle-management
    component: database
  ports:
  # MongoDB default port
  - port: 27017
    targetPort: 27017
    name: mongodb
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: database
spec:
  selector:
    app: cubicle-management
    component: database
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  clusterIP: None
