# ================================================================================
# Backend API Deployment
# IBM Cubicle Management System - Node.js API Server
# ================================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubicle-api
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: api
    version: "1.0.0"
spec:
  replicas: 3  # High availability with multiple replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime deployment
  selector:
    matchLabels:
      app: cubicle-management
      component: api
  template:
    metadata:
      labels:
        app: cubicle-management
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: cubicle-api-sa
      containers:
      - name: api
        image: cubicle-api:latest
        imagePullPolicy: Never  # Use local images in minikube
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # Configuration from ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: PORT
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: FRONTEND_URL
        - name: SEED
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: SEED
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: LOG_LEVEL
        - name: NOTIFICATIONS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cubicle-config
              key: NOTIFICATIONS_ENABLED
        
        # Secrets
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: MONGO_URI
        # Firebase credentials as individual environment variables
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: FIREBASE_PROJECT_ID
        - name: FIREBASE_CLIENT_EMAIL
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: FIREBASE_CLIENT_EMAIL
        - name: FIREBASE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: FIREBASE_PRIVATE_KEY
        - name: FIREBASE_PRIVATE_KEY_ID
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: FIREBASE_PRIVATE_KEY_ID
        - name: ADMIN_UIDS
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: ADMIN_UIDS
        - name: EMAIL_HOST
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: EMAIL_HOST
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: EMAIL_USER
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: cubicle-secrets
              key: EMAIL_PASS
        
        # Timezone setting
        - name: TZ
          value: "America/Costa_Rica"
        
        # Removed volumeMounts - using emptyDir for temp storage only
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 10
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      volumes:
      # Removed PVC dependency - using emptyDir for temp storage only
      - name: temp-storage
        emptyDir: {}
      
      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: cubicle-management
                  component: api
              topologyKey: kubernetes.io/hostname

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: cubicle-api-service
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: api
spec:
  type: ClusterIP
  selector:
    app: cubicle-management
    component: api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  sessionAffinity: None

---
# Service Account for API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubicle-api-sa
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: api

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cubicle-api-pdb
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cubicle-management
      component: api

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cubicle-api-hpa
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cubicle-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
