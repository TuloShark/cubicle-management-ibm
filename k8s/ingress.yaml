# ================================================================================
# Ingress Configuration
# IBM Cubicle Management System - External Access and Load Balancing
# ================================================================================

# Nginx Ingress Controller (if not using cloud provider ingress)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cubicle-management-ingress
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: ingress
  annotations:
    # Nginx Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Security headers
    nginx.ingress.kubernetes.io/custom-http-errors: "404,503"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
      add_header Referrer-Policy strict-origin-when-cross-origin;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';";
    
    # SSL/TLS configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384"
    
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;

spec:
  tls:
  - hosts:
    - cubicle-management.company.com
    - api.cubicle-management.company.com
    secretName: cubicle-management-tls
  
  rules:
  # Frontend application
  - host: cubicle-management.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cubicle-frontend-service
            port:
              number: 80
  
  # API endpoints
  - host: api.cubicle-management.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cubicle-api-service
            port:
              number: 3000

---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cubicle-management
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@company.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Alternative: AWS Application Load Balancer (ALB) Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cubicle-management-alb
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: ingress-alb
  annotations:
    # AWS ALB Ingress Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: cubicle-management-alb
    
    # SSL/TLS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/cert-id
    
    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # Security groups
    alb.ingress.kubernetes.io/security-groups: sg-xxxxxxxxx
    alb.ingress.kubernetes.io/subnets: subnet-xxxxxxxxx,subnet-yyyyyyyyy
    
    # WAF
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:region:account:regional/webacl/name/id

spec:
  rules:
  - host: cubicle-management.company.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cubicle-api-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cubicle-frontend-service
            port:
              number: 80

---
# Network Policy for traffic control
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cubicle-management-network-policy
  namespace: cubicle-management
  labels:
    app: cubicle-management
spec:
  podSelector:
    matchLabels:
      app: cubicle-management
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  
  # Allow inter-pod communication within namespace
  - from:
    - podSelector:
        matchLabels:
          app: cubicle-management
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 27017
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS traffic (for external APIs like Firebase)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  
  # Allow MongoDB communication
  - to:
    - podSelector:
        matchLabels:
          app: cubicle-management
          component: database
    ports:
    - protocol: TCP
      port: 27017
