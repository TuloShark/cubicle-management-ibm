# ================================================================================
# Ingress Configuration - Development/Minikube Version
# IBM Cubicle Management System - Local Development Access
# ================================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cubicle-management-ingress
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: ingress
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

spec:
  rules:
  # Single host for local development
  - http:
      paths:
      # API endpoints - prefix with /api
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cubicle-api-service
            port:
              number: 3000
      # Frontend application - serve everything else
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cubicle-frontend-service
            port:
              number: 80
