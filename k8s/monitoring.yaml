# ================================================================================
# Monitoring and Observability Configuration
# IBM Cubicle Management System - Monitoring Stack
# ================================================================================

# Prometheus ServiceMonitor for API metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cubicle-api-metrics
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
spec:
  selector:
    matchLabels:
      app: cubicle-management
      component: api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Prometheus ServiceMonitor for Frontend metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cubicle-frontend-metrics
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
spec:
  selector:
    matchLabels:
      app: cubicle-management
      component: frontend
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Prometheus ServiceMonitor for MongoDB metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mongodb-metrics
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
spec:
  selector:
    matchLabels:
      app: cubicle-management
      component: database
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: cubicle-management-dashboard
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
    grafana_dashboard: "1"
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "IBM Cubicle Management System",
        "description": "Monitoring dashboard for the Cubicle Management System",
        "tags": ["cubicle", "management", "ibm"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "API Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"cubicle-api-metrics\"}[5m])",
                "legendFormat": "{{method}} {{route}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"cubicle-api-metrics\"}[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          },
          {
            "id": 3,
            "title": "Active Reservations",
            "type": "stat",
            "targets": [
              {
                "expr": "cubicle_reservations_active_total",
                "legendFormat": "Active Reservations"
              }
            ]
          },
          {
            "id": 4,
            "title": "MongoDB Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "mongodb_connections{job=\"mongodb-metrics\"}",
                "legendFormat": "{{state}}"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

---
# Log Aggregation with Fluent Bit
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:2.1.10
        ports:
        - containerPort: 2020
          name: metrics
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        - name: app-logs-storage
          mountPath: /app/logs
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: "elasticsearch.logging.svc.cluster.local"
        - name: FLUENT_ELASTICSEARCH_PORT
          value: "9200"
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "200m"
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: app-logs-storage
        persistentVolumeClaim:
          claimName: app-logs-storage

---
# Fluent Bit Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*cubicle*.log
        Parser            docker
        Tag               cubicle.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB

    [INPUT]
        Name              tail
        Path              /app/logs/*.log
        Parser            json
        Tag               app.*
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               cubicle.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name  es
        Match *
        Host  ${FLUENT_ELASTICSEARCH_HOST}
        Port  ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Logstash_Prefix cubicle-management
        Retry_Limit False

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

---
# Service Account for Fluent Bit
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: cubicle-management

---
# ClusterRole for Fluent Bit
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  - nodes
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for Fluent Bit
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: cubicle-management

# ================================================================================
# Advanced Time-Series Analytics Configuration
# Flexible day-of-week and time-period analysis capabilities
# ================================================================================

---
# PrometheusRule for Custom Business Metrics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cubicle-analytics-rules
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
spec:
  groups:
  - name: cubicle.business.metrics
    interval: 5m
    rules:
    # Daily utilization rate by day of week
    - record: cubicle:daily_utilization_rate
      expr: |
        (
          sum(cubicle_reservations_active_total) / 
          sum(cubicle_total_count)
        ) * 100
      labels:
        metric_type: "utilization_percentage"
    
    # Peak hours utilization (9 AM - 5 PM)
    - record: cubicle:peak_hours_utilization
      expr: |
        (
          sum(cubicle_reservations_active_total{hour=~"0[9-9]|1[0-7]"}) /
          sum(cubicle_total_count)
        ) * 100
      labels:
        time_period: "peak_hours"
    
    # Day-of-week breakdown (0=Sunday, 1=Monday, etc.)
    - record: cubicle:utilization_by_dow
      expr: |
        (
          sum by (day_of_week) (cubicle_reservations_active_total) /
          sum by (day_of_week) (cubicle_total_count)
        ) * 100
    
    # Average utilization over rolling 30 days
    - record: cubicle:utilization_30d_avg
      expr: |
        avg_over_time(cubicle:daily_utilization_rate[30d])
    
    # Section-specific utilization by day
    - record: cubicle:section_utilization_by_dow
      expr: |
        (
          sum by (section, day_of_week) (cubicle_reservations_active_total) /
          sum by (section, day_of_week) (cubicle_total_count)
        ) * 100

---
# Grafana Dashboard for Flexible Analytics
apiVersion: v1
kind: ConfigMap
metadata:
  name: cubicle-analytics-dashboard
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: monitoring
    grafana_dashboard: "1"
data:
  analytics-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Cubicle Analytics - Flexible Time Analysis",
        "description": "Advanced analytics with day-of-week and time-period selection",
        "tags": ["cubicle", "analytics", "time-series"],
        "timezone": "America/Costa_Rica",
        "time": {
          "from": "now-90d",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "day_of_week",
              "type": "custom",
              "options": [
                {"text": "All Days", "value": ".*"},
                {"text": "Monday", "value": "1"},
                {"text": "Tuesday", "value": "2"},
                {"text": "Wednesday", "value": "3"},
                {"text": "Thursday", "value": "4"},
                {"text": "Friday", "value": "5"},
                {"text": "Saturday", "value": "6"},
                {"text": "Sunday", "value": "0"}
              ],
              "current": {"text": "All Days", "value": ".*"}
            },
            {
              "name": "time_period",
              "type": "custom",
              "options": [
                {"text": "Last 30 Days", "value": "30d"},
                {"text": "Last Quarter", "value": "90d"},
                {"text": "Last 6 Months", "value": "180d"},
                {"text": "Last Year", "value": "365d"}
              ],
              "current": {"text": "Last Quarter", "value": "90d"}
            },
            {
              "name": "section",
              "type": "query",
              "query": "label_values(cubicle_total_count, section)",
              "current": {"text": "All", "value": "$__all"}
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "title": "Average Utilization by Selected Day",
            "type": "stat",
            "targets": [
              {
                "expr": "avg_over_time(cubicle:utilization_by_dow{day_of_week=~\"$day_of_week\"}[$time_period])",
                "legendFormat": "Avg Utilization %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "max": 100
              }
            }
          },
          {
            "id": 2,
            "title": "Utilization Trend Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "cubicle:utilization_by_dow{day_of_week=~\"$day_of_week\"}",
                "legendFormat": "{{day_of_week}} Utilization"
              }
            ]
          },
          {
            "id": 3,
            "title": "Day-of-Week Comparison",
            "type": "barchart",
            "targets": [
              {
                "expr": "avg_over_time(cubicle:utilization_by_dow[$time_period])",
                "legendFormat": "Day {{day_of_week}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Section Performance by Selected Day",
            "type": "heatmap",
            "targets": [
              {
                "expr": "avg_over_time(cubicle:section_utilization_by_dow{day_of_week=~\"$day_of_week\", section=~\"$section\"}[$time_period])",
                "legendFormat": "{{section}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Peak vs Off-Peak Hours",
            "type": "piechart",
            "targets": [
              {
                "expr": "avg_over_time(cubicle:peak_hours_utilization{day_of_week=~\"$day_of_week\"}[$time_period])",
                "legendFormat": "Peak Hours"
              },
              {
                "expr": "avg_over_time(cubicle:daily_utilization_rate{day_of_week=~\"$day_of_week\"}[$time_period]) - avg_over_time(cubicle:peak_hours_utilization{day_of_week=~\"$day_of_week\"}[$time_period])",
                "legendFormat": "Off-Peak Hours"
              }
            ]
          }
        ]
      }
    }

---
# Additional Recording Rules for Advanced Analytics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cubicle-advanced-analytics
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: analytics
spec:
  groups:
  - name: cubicle.advanced.analytics
    interval: 1h
    rules:
    # Weekly patterns - Compare same day across weeks
    - record: cubicle:weekly_pattern_comparison
      expr: |
        avg_over_time(cubicle:utilization_by_dow[7d] offset 7d) - 
        avg_over_time(cubicle:utilization_by_dow[7d])
      labels:
        analysis_type: "week_over_week_change"
    
    # Monthly trends for specific days
    - record: cubicle:monthly_day_trend
      expr: |
        (
          avg_over_time(cubicle:utilization_by_dow[30d]) - 
          avg_over_time(cubicle:utilization_by_dow[30d] offset 30d)
        ) / avg_over_time(cubicle:utilization_by_dow[30d] offset 30d) * 100
      labels:
        analysis_type: "monthly_growth_rate"
    
    # Seasonal patterns (quarterly comparison)
    - record: cubicle:quarterly_pattern
      expr: |
        avg_over_time(cubicle:utilization_by_dow[90d])
      labels:
        analysis_type: "quarterly_average"
    
    # Anomaly detection - Days with unusual utilization
    - record: cubicle:utilization_anomaly_score
      expr: |
        abs(
          cubicle:daily_utilization_rate - 
          avg_over_time(cubicle:daily_utilization_rate[30d])
        ) / stddev_over_time(cubicle:daily_utilization_rate[30d])
      labels:
        analysis_type: "anomaly_detection"
