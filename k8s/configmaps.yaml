# ================================================================================
# ConfigMap for Application Configuration
# IBM Cubicle Management System - Non-sensitive Configuration
# ================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: cubicle-config
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: config
data:
  # Application Configuration
  NODE_ENV: "production"
  PORT: "3000"
  FRONTEND_URL: "https://cubicle-management.company.com"
  
  # Database Configuration
  MONGO_DB_NAME: "cubicle_management_prod"
  SEED: "false"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  HEALTH_CHECK_INTERVAL: "300000"
  
  # Feature Flags
  NOTIFICATIONS_ENABLED: "true"
  EMAIL_NOTIFICATIONS_ENABLED: "true"
  
  # Performance Settings
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  
  # MongoDB Connection Settings
  MONGO_MAX_POOL_SIZE: "10"
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "30000"
  MONGO_SOCKET_TIMEOUT_MS: "45000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: frontend
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;
        
        upstream api-backend {
            server cubicle-api-service:3000;
            keepalive 32;
        }
        
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            
            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy strict-origin-when-cross-origin;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';";
            
            # API proxy
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://api-backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
            
            # Socket.IO proxy
            location /socket.io/ {
                proxy_pass http://api-backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Static files with caching
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary Accept-Encoding;
            }
            
            # SPA fallback
            location / {
                limit_req zone=frontend burst=100 nodelay;
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
