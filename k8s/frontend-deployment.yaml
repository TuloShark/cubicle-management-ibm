# ================================================================================
# Frontend Deployment
# IBM Cubicle Management System - Vue.js Frontend with Nginx
# ================================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubicle-frontend
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: frontend
    version: "1.0.0"
spec:
  replicas: 1  # Simplified - single replica for development
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cubicle-management
      component: frontend
  template:
    metadata:
      labels:
        app: cubicle-management
        component: frontend
      annotations:
        # Simplified - removed prometheus annotations
        app.kubernetes.io/name: "cubicle-frontend"
    spec:
      # Simplified security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
      - name: nginx
        image: cubicle-frontend:latest
        imagePullPolicy: Never  # Use local images in minikube
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        # Removed HTTPS port - simplified for development
        
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        # Removed app-logs-storage mount - using emptyDir
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # Simplified capabilities
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      # Removed nginx-exporter sidecar - simplified architecture
      
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      # Removed app-logs-storage PVC dependency
      
      # Simplified - removed complex affinity rules for development

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: cubicle-frontend-service
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: cubicle-management
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  # Removed metrics port - simplified architecture

---
# Frontend Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cubicle-frontend-pdb
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cubicle-management
      component: frontend

---
# Frontend Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cubicle-frontend-hpa
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cubicle-frontend
  minReplicas: 1  # Simplified for development
  maxReplicas: 2  # Reduced complexity
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
