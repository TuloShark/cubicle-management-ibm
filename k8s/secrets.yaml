# ================================================================================
# Secrets Configuration
# IBM Cubicle Management System - Sensitive Configuration
# ================================================================================

# NOTE: This is a template file. In production, use:
# kubectl create secret generic cubicle-secrets --from-env-file=.env --namespace=cubicle-management
# OR use external secret management like AWS Secrets Manager, HashiCorp Vault, etc.

apiVersion: v1
kind: Secret
metadata:
  name: cubicle-secrets
  namespace: cubicle-management
  labels:
    app: cubicle-management
    component: secrets
type: Opaque
data:
  # MongoDB Configuration (base64 encoded)
  # Example: echo -n "mongodb://admin:password@mongodb:27017/cubicle_management_prod?authSource=admin" | base64
  MONGO_URI: <BASE64_ENCODED_MONGO_URI>
  
  # Firebase Configuration (base64 encoded)
  # Example: echo -n "your-firebase-credentials-json" | base64
  FIREBASE_CREDENTIALS_JSON: <BASE64_ENCODED_FIREBASE_CREDENTIALS>
  
  # Admin Configuration (base64 encoded)
  # Example: echo -n "uid1,uid2,uid3" | base64
  ADMIN_UIDS: <BASE64_ENCODED_ADMIN_UIDS>
  
  # Email Configuration (base64 encoded)
  EMAIL_HOST: <BASE64_ENCODED_EMAIL_HOST>
  EMAIL_PORT: <BASE64_ENCODED_EMAIL_PORT>
  EMAIL_SECURE: <BASE64_ENCODED_EMAIL_SECURE>
  EMAIL_USER: <BASE64_ENCODED_EMAIL_USER>
  EMAIL_PASS: <BASE64_ENCODED_EMAIL_PASS>
  EMAIL_FROM: <BASE64_ENCODED_EMAIL_FROM>
  
  # Slack Configuration (base64 encoded)
  SLACK_WEBHOOK_URL: <BASE64_ENCODED_SLACK_WEBHOOK_URL>

---
# External Secret Operator Example (if using external secret management)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cubicle-secret-store
  namespace: cubicle-management
spec:
  provider:
    # AWS Secrets Manager example
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cubicle-external-secrets
  namespace: cubicle-management
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: cubicle-secret-store
    kind: SecretStore
  target:
    name: cubicle-secrets-external
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: cubicle-management/prod
        property: mongo_uri
    - secretKey: FIREBASE_CREDENTIALS_JSON
      remoteRef:
        key: cubicle-management/prod
        property: firebase_credentials
    - secretKey: ADMIN_UIDS
      remoteRef:
        key: cubicle-management/prod
        property: admin_uids
